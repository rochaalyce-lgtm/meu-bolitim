<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Cabeçalho principal -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitle">9º Ano - Estudante Exemplo</p>
    </header>

    <!-- Área de cards de resumo -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="card-value">—</p>
      </div>
      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="card-value">—</p>
      </div>
      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="bom-desempenho" class="card-value">—</p>
      </div>
      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="precisa-atencao" class="card-value">—</p>
      </div>
      <div class="card highlight">
        <h3>Frequência</h3>
        <p id="frequencia" class="card-value">92%</p>
        <span class="subtext">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de disciplinas e notas -->
    <section class="table-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- O JavaScript preencherá as linhas aqui automaticamente -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
